services:
  - type: web
    name: sage-code-reviewer-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_KEYS
        sync: false
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: code_reviewer
