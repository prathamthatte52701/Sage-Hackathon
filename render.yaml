services:
  - type: web
    name: code-master-ai-reviewer-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_KEYS
        sync: false
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_ENABLED
        value: "false"
      - key: DEMO_USER_ID
        value: demo-user
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: MONGO_DB_NAME
        value: code_reviewer

